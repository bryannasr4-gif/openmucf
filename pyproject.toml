[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openmucf"
version = "1.1.0"
description = "Open FAIR rate ledger + differentiable muon-catalyzed-fusion cycle/energy auditor"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Bryan Nasr", email = "bryannasr4@gmail.com" }]
keywords = ["muon-catalyzed-fusion", "fusion", "kinetics", "uncertainty-quantification", "jax"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "jax>=0.4",
    "diffrax>=0.5",
    "optimistix>=0.1",  # frontier.py: Newton root-find for the inverse-design solver (also transitive via diffrax)
    "numpyro>=0.13",
    "SALib>=1.4",
    # Arrived transitively (SALib requires pandas>=2.0) and no first-party module imports it; kept
    # declared because the resolver installs it either way and dropping it would only hide the fact.
    "pandas>=2.0",
    "matplotlib>=3.7",
    # Declared 2026-08-12: both were imported by shipped code while relying on a transitive install.
    # numpy floor is EXACT, not conventional -- the suite calls np.trapezoid (tests/test_twin.py),
    # which is the NumPy-2.0 rename of np.trapz and does not exist in 1.x.
    "numpy>=2.0",
    # Pillow: scripts/digitize_yamashita_fig3a.py (Image.open(...).convert("RGB")). CONSERVATIVE
    # bound, not a tested minimum -- only the long-stable Image API is used, and 10.0 is the first
    # major series released after this project's requires-python floor (3.11).
    "pillow>=10.0",
]

[project.optional-dependencies]
# scipy is TEST-ONLY (scipy.stats.chisquare in tests/test_calibrate_sbc.py) and deliberately NOT a
# runtime dependency -- openmucf/exact.py says so and uses jax.scipy instead. Floor = the one SALib
# already imposes. mypy is capped below the next major: the `types` CI job is BLOCKING as of
# 2026-08-12, so a major-version bump (which may add checks) is a deliberate upgrade, not a red main.
# jax is capped for the TEST environment only -- the runtime floor above is deliberately left
# alone. jax 0.11.1 moves the seed-0 NUTS chain that tests/test_calibrate.py pins, taking its
# omega_s0 r_hat from <1.05 to 36.88775458613908 on ubuntu/3.12 and 3.13, and reddening the
# `audit` job at "CALIBRATION.md audit FAILED". The pinned jobs (`locked`, `cross-arch`), which
# resolve 0.10.2 from requirements-lock.txt, are green on both architectures throughout, so this
# is a floating-resolution problem, not a code one. STOPGAP, and deliberately narrow: the
# assertion it protects samples an UNBOUNDED prior on a thin degeneracy ridge and is now brittle
# in library version as well as architecture, so the durable fix is a decision about that cell
# -- tolerance band, bounded prior, or a pin in the floating jobs too -- not this line. Drop the
# cap when that lands.
dev = ["pytest>=7", "ruff>=0.5", "mypy>=1.10,<3", "scipy>=1.9.3", "jax<0.11.1"]

[project.scripts]
openmucf = "openmucf.cli:main"

[project.urls]
DOI = "https://doi.org/10.5281/zenodo.21251511"  # version-independent concept DOI
Homepage = "https://github.com/bryannasr4-gif/openmucf"
Repository = "https://github.com/bryannasr4-gif/openmucf"
Documentation = "https://github.com/bryannasr4-gif/openmucf/tree/main/docs"
Changelog = "https://github.com/bryannasr4-gif/openmucf/blob/main/CHANGELOG.md"

[tool.setuptools]
# Explicit list, not `packages.find`: the data layer is planned to be lifted into its own
# distribution, and an explicit list is what makes that move a visible one-line edit rather than a
# silent consequence of directory layout. `openmucf.g4` must be named here or a wheel ships the
# parent package without it -- tests/test_g4spec.py pins that it is.
packages = ["openmucf", "openmucf.g4", "openmucf.g4.sources"]

[tool.setuptools.package-data]
openmucf = ["data/*", "data/benchmarks/*", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: long-running tests (the twin interval-calibration coverage run); deselected by default, run explicitly with `pytest -m slow`",
]
# Default collection deselects `slow` (kept out of the fast suite + CI); a command-line `-m slow` overrides this.
addopts = "-m 'not slow'"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
ignore = ["E741"]  # single-letter names (E, R, F, T, ...) are standard physics notation here

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E501"]  # report generators embed long markdown lines in f-strings

