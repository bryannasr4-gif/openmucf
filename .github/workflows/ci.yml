name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly slow-suite sweep (SBC coverage, 200 seeded MCMC replicas) on BOTH architectures. These are
    # the repo's strongest statistical claims and `pytest -q` deselects them, so nothing else exercises
    # them; they are too slow (~10-15 min) to gate every push.
    - cron: "0 5 * * 1"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" ruff
      # The .g4dat emitter must produce identical bytes under a comma-decimal LC_NUMERIC, which is
      # the failure mode that turns a table of rates into a table of zeros in a C reader. The test
      # that proves it FAILS rather than skips on Linux, so the locale has to exist here: a skip on
      # the one platform we can guarantee it on would be a green tick for a check that never ran.
      # The `locale -a` grep makes a silently ineffective locale-gen fail this step instead of
      # surfacing later as a confusing test failure.
      - name: Install a comma-decimal locale
        run: |
          sudo locale-gen de_DE.UTF-8
          sudo update-locale
          locale -a | grep -i 'de_DE'
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q

  locked:
    # Pinned-environment reproducibility: install the exact validated versions and run the suite.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install (pinned lockfile)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt
          pip install -e . --no-deps
      # This job runs the same suite as `test`, so it needs the same locale. Adding it to only one
      # of the two ubuntu jobs that run pytest would leave the other red for a reason unrelated to
      # what it exists to check.
      - name: Install a comma-decimal locale
        run: |
          sudo locale-gen de_DE.UTF-8
          sudo update-locale
          locale -a | grep -i 'de_DE'
      - name: Test
        run: pytest -q

  audit:
    # Reproducibility gate: regenerated FINDINGS/VALIDATION must match what's committed (no doc-vs-code drift).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Audit (regenerate the deterministic docs and fail on drift)
        run: make audit
      - name: Forecast determinism (regenerate the card twice; byte-compare fresh outputs)
        run: |
          python scripts/generate_forecast.py
          cp forecasts/FC-001-mufuse.json /tmp/fc1.json
          python scripts/generate_forecast.py
          cmp forecasts/FC-001-mufuse.json /tmp/fc1.json
          echo "forecast determinism OK: two fresh regenerations are byte-identical"

  cross-arch:
    # CROSS-ARCHITECTURE reproducibility gate (arm64 / Apple Silicon). Every other job in this file runs
    # on x86-64, so before this existed the tolerance bands that exist to absorb cross-architecture MCMC
    # drift were never exercised: on one architecture every audited cell reproduces at 0 distance and an
    # "OK" proves determinism, not that the band is correctly sized. A one-off manual arm64 reproduction
    # (2026-07-23) found that gap was hiding real defects -- an under-sized design band and two
    # exact-equality forecast tests that could not pass off x86-64. This job makes it a standing gate.
    #
    # It installs from requirements-lock.txt on purpose: that also fails loudly if a pinned wheel ever
    # ships without an arm64 build (all 41 currently do).
    runs-on: macos-15   # GitHub-hosted Apple Silicon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install (pinned lockfile, arm64 wheels)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt   # pytest + ruff are pinned in there too
          pip install -e . --no-deps
      - name: Show architecture
        run: python -c "import platform,sys; print(platform.machine(), platform.platform(), sys.version)"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q
      - name: Audit (byte-diffed docs + tolerance-audited NUTS docs, on arm64)
        run: make audit

  slow:
    # Weekly only (see the `schedule` trigger): SBC coverage + the twin-coverage replicas, both arches.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Slow suite
        run: pytest -q -m slow -s

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Test
        run: pytest -q

  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Run quickstart
        run: python examples/quickstart.py

  types:
    # Static type check. BLOCKING: `mypy openmucf --ignore-missing-imports` must be clean. It was
    # masked with `continue-on-error: true` while the package carried a standing 6-error set; that set
    # is fixed (real annotations, no blanket suppressions), so the mask is gone and a new type error
    # now fails the build instead of being reported and ignored.
    #
    # Known limit, stated rather than implied: this is mypy's DEFAULT mode, which does not check the
    # bodies of unannotated functions. Adding --check-untyped-defs today reports 3 further errors
    # (formation.py:104, frontier.py:166, frontier.py:167) that this gate does not see. Tightening to
    # that flag is a separate, deliberate change -- it widens what must be fixed, so it is not
    # smuggled in here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: mypy
        run: mypy openmucf --ignore-missing-imports

  paper:
    # JOSS paper artifact. BLOCKING: paper/paper.md must compile to paper.pdf before merge.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build draft paper PDF
        uses: openjournals/openjournals-draft-action@master
        with:
          journal: joss
          paper-path: paper/paper.md
      - name: Upload paper PDF
        uses: actions/upload-artifact@v4
        with:
          name: paper
          path: paper/paper.pdf
